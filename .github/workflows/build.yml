name: build-image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      cuda:
        description: CUDA 10.2 userspace to include
        type: choice
        options: [runtime, toolkit, none]
        default: runtime
      extra_packages:
        description: Extra packages (space-separated, Devuan or NVIDIA repo)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Native arm64: no qemu emulation needed for the chroot steps.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af >/dev/null || true
          df -h /

      - name: Build image (privileged debian:trixie container)
        env:
          CUDA: ${{ inputs.cuda || 'runtime' }}
          EXTRA_PACKAGES: ${{ inputs.extra_packages || '' }}
          IMAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-{1}', github.run_number, github.sha) }}
        run: |
          IMAGE_VERSION=$(echo "$IMAGE_VERSION" | cut -c1-24)
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e CUDA -e EXTRA_PACKAGES -e IMAGE_VERSION="$IMAGE_VERSION" \
            debian:trixie bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                mmdebstrap e2fsprogs gdisk xz-utils curl ca-certificates dpkg-dev >/dev/null
              WORK=/src/work OUT=/src/out bash build.sh
            '
          sudo rm -rf work
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetson-nano-devuan-image
          path: out/*
          compression-level: 0
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
          body: |
            Devuan Excalibur (OpenRC, no systemd) for Jetson Nano with NVIDIA L4T R32.7.6 (kernel 4.9.337, CUDA 10.2).
            Requires the module's QSPI bootloader to be on L4T R32.7.x. See README for flashing, first boot, and the serial console.
            Contains NVIDIA proprietary components distributed under NVIDIA's license terms.
