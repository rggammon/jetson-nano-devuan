TIMEOUT 30
DEFAULT primary

MENU TITLE L4T boot options

# Uses the kernel DTB from QSPI (passed by cboot), like NVIDIA's stock SD images.
# console=ttyS0 is the J50 debug UART; "quiet" is omitted on purpose.
LABEL primary
      MENU LABEL primary kernel
      LINUX /boot/Image
      INITRD /boot/initrd
      APPEND ${cbootargs} root=/dev/mmcblk0p1 rw rootwait rootfstype=ext4 console=ttyS0,115200n8 console=tty0 fbcon=map:0 net.ifnames=0

# To test a custom kernel, copy /boot/Image to /boot/Image.backup and add:
# LABEL backup
#    MENU LABEL backup kernel
#    LINUX /boot/Image.backup
#    INITRD /boot/initrd
#    APPEND ${cbootargs} root=/dev/mmcblk0p1 rw rootwait rootfstype=ext4 console=ttyS0,115200n8 console=tty0 fbcon=map:0 net.ifnames=0
